[project]
name = "nc-bench-ui"
version = "0.1.0"
description = "NC candidate bench web UI: record phone/web/upload audio, run it through noise-cancellation chains, compare STT + audio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "aiohttp>=3.10",
    "numpy>=1.26",
    "psutil>=5.9",
    "soundfile>=0.12",
    "soxr>=0.5",
    "onnxruntime>=1.18",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "livekit-plugins-noise-cancellation==0.2.6",
    "livekit-plugins-ai-coustics>=0.3.0",
    "aic-sdk>=2.5.0",
    "livekit-plugins-silero>=1.6.7",
]

# Hecttor's SDK is deliberately absent from `dependencies`. It is proprietary,
# it is not on PyPI, and it is not redistributed here — it ships as a
# per-licensee wheel. It is not declared as an optional extra either: `uv lock`
# resolves extras too, so a bare "hecttor-sdk" that exists in no index makes the
# whole lock unsatisfiable. It is a manual, out-of-band install:
#
#   uv pip install /path/to/hecttor_sdk-<version>-<platform>.whl
#
# Without it hecttor_available() reports "hecttor_sdk wheel not installed in
# this venv" and the UI greys those candidates out — the same path ai-coustics
# already takes when AIC_LICENSE_KEY is unset. Everything else still runs.

[tool.uv]
package = false
